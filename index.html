<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sol y luna</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--ink:#fff;--glass:rgba(10,14,30,.45)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0;background:#0a0e1e;overflow:hidden;font-family:Georgia,"Times New Roman",serif;color:var(--ink);touch-action:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
.ui{position:fixed;left:0;right:0;bottom:0;padding:16px 20px calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:10px;align-items:center}
.hint{background:var(--glass);padding:8px 14px;border-radius:999px;font-size:15px;text-align:center;backdrop-filter:blur(6px)}
button{font:inherit;font-size:16px;color:var(--ink);background:var(--glass);border:1px solid rgba(255,255,255,.4);padding:10px 18px;border-radius:999px;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid #fff;outline-offset:3px}
input[type=range]{width:min(420px,86%);accent-color:#ffd27a}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="ui">
  <div class="hint" id="hint">Gira el móvil de lado: el sol baja y sale la luna</div>
  <button id="btn">Activar sensor de movimiento</button>
  <input type="range" id="sl" min="0" max="100" value="0" aria-label="Giro">
</div>
<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const sl=document.getElementById('sl'),btn=document.getElementById('btn'),hint=document.getElementById('hint');
let W,H,dpr,target=0,t=0;
const stars=Array.from({length:90},()=>({x:Math.random(),y:Math.random()*.65,r:Math.random()*1.4+.4,p:Math.random()*6}));
function size(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*dpr;cv.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}
addEventListener('resize',size);size();
const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v));
const hex=h=>[1,3,5].map(i=>parseInt(h.substr(i,2),16));
function mix(a,b,k){a=hex(a);b=hex(b);return `rgb(${a.map((v,i)=>Math.round(v+(b[i]-v)*k)).join(',')})`}
const day=['#3b8fe6','#bfe6ff'],dusk=['#5a3b7a','#ff9a5a'],night=['#040714','#1a2756'];
function sky(t){const A=t<.5?[day,dusk]:[dusk,night],k=t<.5?t*2:(t-.5)*2;return[mix(A[0][0],A[1][0],k),mix(A[0][1],A[1][1],k)]}
function draw(time){
  t+=(target-t)*.08;
  const [top,bot]=sky(t),g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,top);g.addColorStop(.75,bot);
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  const hz=H*.74,R=Math.min(W,H)*.11;
  const sa=clamp((t-.3)/.5);
  stars.forEach(s=>{ctx.globalAlpha=sa*(.55+.45*Math.sin(time/700+s.p));ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(s.x*W,s.y*H,s.r,0,7);ctx.fill()});
  ctx.globalAlpha=1;
  // sol
  const st=clamp(t/.75),sx=W*(.5-.18*st),sy=H*.26+st*(hz-H*.26+R*2.2);
  let sg=ctx.createRadialGradient(sx,sy,R*.4,sx,sy,R*3.4);sg.addColorStop(0,'rgba(255,220,130,.75)');sg.addColorStop(1,'rgba(255,170,80,0)');
  ctx.fillStyle=sg;ctx.beginPath();ctx.arc(sx,sy,R*3.4,0,7);ctx.fill();
  ctx.fillStyle=mix('#fff3b0','#ff7a2e',st);ctx.beginPath();ctx.arc(sx,sy,R,0,7);ctx.fill();
  // luna
  const mt=clamp((t-.3)/.7),mx=W*(.5+.18*mt),my=hz+R*2.4-mt*(hz+R*2.4-H*.24);
  let mg=ctx.createRadialGradient(mx,my,R*.5,mx,my,R*3);mg.addColorStop(0,'rgba(190,210,255,.45)');mg.addColorStop(1,'rgba(190,210,255,0)');
  ctx.fillStyle=mg;ctx.beginPath();ctx.arc(mx,my,R*3,0,7);ctx.fill();
  ctx.fillStyle='#eef1fb';ctx.beginPath();ctx.arc(mx,my,R*.85,0,7);ctx.fill();
  ctx.fillStyle='rgba(150,160,190,.45)';
  [[-.3,-.2,.2],[.25,.1,.15],[-.1,.35,.12]].forEach(c=>{ctx.beginPath();ctx.arc(mx+c[0]*R,my+c[1]*R,c[2]*R,0,7);ctx.fill()});
  // colinas
  ctx.fillStyle=mix('#1f3d2b','#05080f',t);
  ctx.beginPath();ctx.moveTo(0,H);ctx.lineTo(0,hz);
  for(let x=0;x<=W;x+=12)ctx.lineTo(x,hz+Math.sin(x/W*5+1)*H*.018+Math.sin(x/W*13)*H*.006);
  ctx.lineTo(W,H);ctx.fill();
  requestAnimationFrame(draw)
}
requestAnimationFrame(draw);
function set(v){target=clamp(v);sl.value=Math.round(target*100)}
sl.addEventListener('input',()=>{target=sl.value/100});
let drag=null;
cv.addEventListener('pointerdown',e=>{drag={x:e.clientX,t:target}});
addEventListener('pointermove',e=>{if(drag)set(drag.t+(e.clientX-drag.x)/(W*.6))});
addEventListener('pointerup',()=>drag=null);
let live=false;
function onOri(e){if(e.gamma==null)return;live=true;set(Math.abs(e.gamma)/70);hint.textContent='Cuanto más gires el móvil, más se hace de noche'}
async function enable(){
  try{
    if(typeof DeviceOrientationEvent!=='undefined'&&DeviceOrientationEvent.requestPermission){
      const r=await DeviceOrientationEvent.requestPermission();
      if(r!=='granted'){hint.textContent='Permiso denegado. Usa el deslizador o arrastra la pantalla';return}
    }
    addEventListener('deviceorientation',onOri);
    btn.style.display='none';
    setTimeout(()=>{if(!live)hint.textContent='Sin sensor aquí. Usa el deslizador o arrastra la pantalla'},1500);
  }catch(err){hint.textContent='No se pudo activar el sensor. Usa el deslizador'}
}
btn.addEventListener('click',enable);
</script>
</body>
</html>
